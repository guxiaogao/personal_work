services:
  postgres:
    image: postgres:16
    container_name: doa-postgres
    environment:
      POSTGRES_USER: doa
      POSTGRES_PASSWORD: doa
      POSTGRES_DB: doa
    ports:
      - "5433:5432"
    volumes:
      - doa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doa -d doa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  doa-pgdata:
